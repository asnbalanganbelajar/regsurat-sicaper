<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="3;url=https://script.google.com/macros/s/AKfycbzHuEBBipn4AqgTqEDquiknS339KqgXPmnjzB6xFP1UUY3ViHNCVSjoGeDXG2JK1WEL/exec">
    <title>SICAPER - BKPSDM Balangan</title>

    <style>
        :root {
            --navy: #1e293b;
            --navy-dark: #0f172a;
            --green: #059669;
            --orange: #ea580c;
            --light: #f8fafc;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #334155;
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .portal {
            width: 100%;
            max-width: 520px;
            overflow: hidden;
            border-radius: 22px;
            background: #ffffff;
            box-shadow:
                0 20px 25px -5px rgba(15, 23, 42, 0.12),
                0 10px 10px -5px rgba(15, 23, 42, 0.06);
        }

        .brand {
            position: relative;
            overflow: hidden;
            padding: 42px 32px 36px;
            text-align: center;
            color: #ffffff;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
        }

        .brand::before,
        .brand::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .45;
        }

        .brand::before {
            top: -60px;
            right: -40px;
            background: var(--green);
        }

        .brand::after {
            left: -50px;
            bottom: -70px;
            background: var(--orange);
        }

        .logo {
            position: relative;
            z-index: 2;
            width: 88px;
            height: 88px;
            object-fit: contain;
            margin-bottom: 14px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .28));
        }

        .title {
            position: relative;
            z-index: 2;
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .subtitle {
            position: relative;
            z-index: 2;
            margin-top: 10px;
            font-size: .9rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, .75);
        }

        .content {
            padding: 32px;
            text-align: center;
        }

        .spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto 20px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--navy);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .content h2 {
            margin: 0 0 8px;
            font-size: 1.1rem;
            color: var(--navy);
        }

        .content p {
            margin: 0;
            font-size: .88rem;
            line-height: 1.6;
            color: var(--muted);
        }

        .manual-link {
            display: inline-block;
            margin-top: 22px;
            padding: 10px 18px;
            border-radius: 999px;
            color: #ffffff;
            text-decoration: none;
            font-size: .85rem;
            font-weight: 700;
            background: var(--navy);
            transition: .2s ease;
        }

        .manual-link:hover {
            transform: translateY(-1px);
            background: #334155;
        }

        .footer {
            margin-top: 24px;
            font-size: .72rem;
            color: #94a3b8;
        }

        @media (max-width: 576px) {
            body {
                padding: 16px;
            }

            .brand {
                padding: 34px 22px 30px;
            }

            .content {
                padding: 28px 22px;
            }

            .title {
                font-size: 1.7rem;
            }

            .logo {
                width: 76px;
                height: 76px;
            }
        }
    </style>

    <script>
        const targetUrl = 'https://script.google.com/macros/s/AKfycbzHuEBBipn4AqgTqEDquiknS339KqgXPmnjzB6xFP1UUY3ViHNCVSjoGeDXG2JK1WEL/exec';

        window.addEventListener("DOMContentLoaded", function () {
            setTimeout(function () {
                window.location.replace(targetUrl);
            }, 1200);
        });
    </script>
</head>
<body>

    <main class="portal">
        <section class="brand">
            <img
                class="logo"
                src="https://lh3.googleusercontent.com/pw/AP1GczN7ufulI_rQtJKcpRoa3XLkYc72vg-cmZVNYqM730nWdWONDhiwlrxlTmIbtTNUtZHP-oAC0flAjxc9b06ROnL9GCtKWCuCyYKk43h-408xvaQ1_HL39x_CFu8J3ENQ6DbHB4BEp1onZYi3FVPbLn4p=w500-h500-s-no-gm?authuser=0"
                alt="Logo SICAPER"
            >

            <h1 class="title">SICAPER</h1>

            <div class="subtitle">
                Sistem Informasi &amp; Catatan Persuratan<br>
                BKPSDM Kabupaten Balangan
            </div>
        </section>

        <section class="content">
            <div class="spinner" aria-hidden="true"></div>

            <h2>Membuka Aplikasi SICAPER</h2>

            <p>
                Anda sedang diarahkan ke layanan SICAPER.<br>
                Jika halaman tidak berpindah secara otomatis, gunakan tombol di bawah.
            </p>

            <a class="manual-link" href="https://script.google.com/macros/s/AKfycbzHuEBBipn4AqgTqEDquiknS339KqgXPmnjzB6xFP1UUY3ViHNCVSjoGeDXG2JK1WEL/exec">
                Buka SICAPER
            </a>

            <div class="footer">
                &copy; 2026 BKPSDM Kabupaten Balangan
            </div>
        </section>
    </main>

        <p style="text-align:center">
            JavaScript tidak aktif.
            <a href="https://script.google.com/macros/s/AKfycbzHuEBBipn4AqgTqEDquiknS339KqgXPmnjzB6xFP1UUY3ViHNCVSjoGeDXG2JK1WEL/exec">Klik di sini untuk membuka SICAPER.</a>
        </p>
    </noscript>

</body>
</html>
